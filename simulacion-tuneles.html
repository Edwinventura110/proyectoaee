<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sellado de garrafones</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  
:root {
  --bg: #e6eaee;
  --panel: #fbfcfd;
  --fg: #1d242b;
  --muted: #5d6975;
  --line: #c9d1d9;
  --accent: #1f66b8;
  --accent-fg: #ffffff;
  --ok: #2b9a58;
  --shade: rgba(20, 30, 40, 0.14);
  --floor-shadow: 0.22;
  --font-ui: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151a1f; --panel: #1f262d; --fg: #e8edf2; --muted: #9aa7b4; --line: #34404b;
    --accent: #4a9be8; --accent-fg: #0c1722; --ok: #46c07a; --shade: rgba(0, 0, 0, 0.5);
    --floor-shadow: 0.5; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151a1f; --panel: #1f262d; --fg: #e8edf2; --muted: #9aa7b4; --line: #34404b;
  --accent: #4a9be8; --accent-fg: #0c1722; --ok: #46c07a; --shade: rgba(0, 0, 0, 0.5);
  --floor-shadow: 0.5; color-scheme: dark;
}
html { box-sizing: border-box; height: 100%; }
body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--font-ui); }
#stage { position: absolute; inset: 0; touch-action: none; cursor: grab; outline: none; }
#stage:active { cursor: grabbing; }
#stage:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
#stage canvas { display: block; }

#ui { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#ui > * { pointer-events: auto; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; box-shadow: 0 2px 10px var(--shade); }
.seg button { font: 600 14px/1 var(--font-ui); letter-spacing: 0.01em; color: var(--muted); background: transparent; border: 0; border-radius: 7px; min-height: 36px; padding: 0 14px; cursor: pointer; }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.seg button:focus-visible, .btn:focus-visible, input[type="range"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { font: 600 14px/1 var(--font-ui); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-height: 42px; padding: 0 16px; cursor: pointer; box-shadow: 0 2px 10px var(--shade); }
.chips { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font: 600 12px/1 var(--font-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; }
.chip[data-on="true"] { color: var(--accent-fg); background: var(--accent); border-color: var(--accent); }
.chip.count { color: var(--fg); font-variant-numeric: tabular-nums; }
.chip.count b { color: var(--ok); font-size: 14px; margin-left: 6px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.speed { display: inline-flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-height: 42px; padding: 0 14px; box-shadow: 0 2px 10px var(--shade); font: 600 13px/1 var(--font-ui); color: var(--muted); }
.speed input { width: 120px; accent-color: var(--accent); }
.top { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.spacer { flex: 1; pointer-events: none; }
#fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; font: 15px/1.5 var(--font-ui); }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&display=swap">

</head>
<body>
<div id="stage" tabindex="0" role="img" aria-label="Vista 3D de túneles de termocontracción. Arrastra para girar, usa la rueda o pellizca para acercar."></div>

<div id="ui">
  <div class="top">
    <div class="seg" role="tablist" aria-label="Vista">
      <button id="m-real" role="tab" aria-selected="true">Modelo realista</button>
      <button id="m-proc" role="tab" aria-selected="false">Proceso de sellado</button>
    </div>
    <div class="chips" id="stages" hidden>
      <span class="chip" id="s0" data-on="false">Entrada</span>
      <span class="chip" id="s1" data-on="false">Calentamiento</span>
      <span class="chip" id="s2" data-on="false">Sellado</span>
      <span class="chip count" id="cnt">Sellados<b id="cntn">0</b></span>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="bar" id="bar" hidden>
    <button class="btn" id="play" aria-pressed="true">Pausar</button>
    <label class="speed" for="spd">Velocidad<input id="spd" type="range" min="0.1" max="0.7" step="0.05" value="0.3"></label>
    <div class="seg" role="group" aria-label="Tipo de túnel">
      <button id="k-ped" aria-pressed="true">Pedestal</button>
      <button id="k-mesa" aria-pressed="false">Mesa</button>
    </div>
    <div class="seg" role="group" aria-label="Vista en corte">
      <button id="cut" aria-pressed="true">Corte</button>
    </div>
  </div>
</div>

<script>
(function () {
  var T = window.THREE;
  var stage = document.getElementById('stage');
  var css = getComputedStyle(document.documentElement);
  function tok(n) { return css.getPropertyValue(n).trim(); }
  function $(id) { return document.getElementById(id); }

  var renderer;
  try { renderer = new T.WebGLRenderer({ antialias: true }); }
  catch (err) {
    var f = document.createElement('div'); f.id = 'fallback';
    f.textContent = 'Este navegador no pudo iniciar la vista 3D.';
    stage.appendChild(f); return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = T.sRGBEncoding;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  var scene = new T.Scene();
  var camera = new T.PerspectiveCamera(30, 1, 0.1, 100);

  /* ---------- entorno de estudio para reflejos del acero ---------- */
  (function () {
    var es = new T.Scene();
    var c = document.createElement('canvas'); c.width = 512; c.height = 256;
    var x = c.getContext('2d');
    var gr = x.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#f4f7fb'); gr.addColorStop(0.46, '#bcc5cf');
    gr.addColorStop(0.5, '#7b848d'); gr.addColorStop(1, '#3a4046');
    x.fillStyle = gr; x.fillRect(0, 0, 512, 256);
    var dome = new T.Mesh(new T.SphereGeometry(50, 32, 16), new T.MeshBasicMaterial({ map: new T.CanvasTexture(c), side: T.BackSide }));
    es.add(dome);
    function soft(w, h, px, py, pz, v) {
      var m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: new T.Color(v, v, v), side: T.DoubleSide }));
      m.position.set(px, py, pz); m.lookAt(0, 0, 0); es.add(m);
    }
    soft(16, 8, 0, 20, 0, 4); soft(8, 12, 22, 7, 8, 3); soft(8, 12, -22, 7, 6, 2.2); soft(14, 6, 0, 8, -24, 2.6);
    var pm = new T.PMREMGenerator(renderer);
    scene.environment = pm.fromScene(es, 0.02).texture;

          cyl(0.025, bot - 0.06, mats.steel, x, (bot + 0.06) / 2, z, g);
          foot(x, z, g);
          box(0.06, 0.04, 0.06, mats.steel, x, bot - 0.02, z, g);
        });
        cyl(0.016, 0.6, mats.steel, x, 0.34, 0, g, 'z');
      });
      [-0.3, 0.3].forEach(function (z) { cyl(0.016, 1.36, mats.steel, 0, 0.34, z, g, 'x'); });
    } else {
      [-0.62, 0.62].forEach(function (x) {
        [-0.2, 0.2].forEach(function (z) {
          cyl(0.034, 0.02, mats.rubber, x, 0.01, z, g);
          cyl(0.01, 0.05, mats.polish, x, 0.04, z, g);
          for (var k = 0; k < 3; k++) tor(0.0105, 0.0014, mats.steel, x, 0.03 + k * 0.012, z, g, 'y');
        });
      });
    }
    var cz = -0.03, cw = 0.62, ch = 0.58, cd = 0.22, f = cz + cd / 2, y0 = top + 0.053;
    rbox(0.74, 0.006, 0.3, 0.004, mats.steel, 0, top + 0.05, cz, g);
    [-0.32, 0.32].forEach(function (x) { [-0.1, 0.1].forEach(function (z) { cyl(0.006, 0.05, mats.polish, x, top + 0.025, cz + z, g); }); });
    rbox(cw, ch, cd, 0.01, mats.cab, 0, y0 + ch / 2, cz, g);
    box(cw - 0.06, 0.003, 0.003, mats.seam, 0, y0 + ch - 0.03, f + 0.0015, g);
    box(cw - 0.06, 0.003, 0.003, mats.seam, 0, y0 + 0.03, f + 0.0015, g);
    box(0.003, ch - 0.06, 0.003, mats.seam, -(cw / 2 - 0.03), y0 + ch / 2, f + 0.0015, g);
    box(0.003, ch - 0.06, 0.003, mats.seam, cw / 2 - 0.03, y0 + ch / 2, f + 0.0015, g);
    cyl(0.025, 0.012, mats.polish, -0.1, y0 + 0.5, f + 0.004, g, 'z');
    cyl(0.019, 0.022, mats.black, -0.1, y0 + 0.5, f + 0.014, g, 'z');
    cyl(0.04, 0.008, mats.grey, 0.15, y0 + 0.5, f + 0.004, g, 'z');
    cyl(0.03, 0.022, mats.red, 0.15, y0 + 0.5, f + 0.017, g, 'z');
    var dome = mk(new T.SphereGeometry(0.03, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), mats.red, 0.15, y0 + 0.5, f + 0.028, g); dome.rotation.x = Math.PI / 2;
    rbox(0.25, 0.19, 0.014, 0.008, mats.black, 0, y0 + 0.31, f + 0.004, g);
    var scr = new T.Mesh(new T.PlaneGeometry(0.2, 0.125), mats.screen); scr.position.set(0, y0 + 0.31, f + 0.0113); g.add(scr);
    var led = cyl(0.004, 0.004, mats.green, 0.09, y0 + 0.2, f + 0.003, g, 'z');
    cyl(0.02, 0.01, mats.polish, 0, y0 + 0.09, f + 0.005, g, 'z');
    box(0.003, 0.02, 0.003, mats.black, 0, y0 + 0.09, f + 0.0105, g);
    [0.5, 0.43].forEach(function (yy) { cyl(0.017, 0.05, mats.black, -cw / 2 - 0.02, y0 + yy, cz + 0.04, g, 'x'); });
    [-0.37, 0.37].forEach(function (x) {
      var mz = cz - 0.06;
      var sk = mk(new T.CylinderGeometry(0.05, 0.095, 0.05, 32), mats.polish, x, top + 0.025, mz, g);
      for (var q = 0; q < 16; q++) {
        var a = q / 16 * Math.PI * 2, fn = box(0.004, 0.045, 0.045, mats.polish, x + Math.cos(a) * 0.072, top + 0.026, mz + Math.sin(a) * 0.072, g);
        fn.rotation.y = -a;
      }
      cyl(0.06, 0.24, mats.motor, x, top + 0.17, mz, g);
      cyl(0.0618, 0.05, mats.band, x, top + 0.16, mz, g);
      cyl(0.05, 0.02, mats.motor, x, top + 0.29, mz, g);
      cyl(0.02, 0.03, mats.black, x, top + 0.314, mz, g);
      if (x < 0) { rbox(0.06, 0.05, 0.05, 0.008, mats.black, x - 0.08, top + 0.12, mz, g); cyl(0.02, 0.04, mats.black, x - 0.12, top + 0.12, mz, g, 'x'); }
    });
    return { group: g, body: body, L: L, H: H, D: D, Y: Y, parts: particles(L, H, D, Y) };
  }

  /* ---------- transportadora ---------- */
  var BELT_TOP = 0.72, BELT_LEN = 4.8;
  var belt = null;
  function buildConveyor() {
    var g = new T.Group(), len = BELT_LEN;
    var bt = beltTex(); bt.repeat.set(len / 0.05, 1);
    belt = bt;
    mk(new T.BoxGeometry(len, 0.014, 0.34), new T.MeshStandardMaterial({ map: bt, roughness: 0.7, metalness: 0.1 }), 0, BELT_TOP - 0.007, 0, g);
    [-0.19, 0.19].forEach(function (z) {
      rbox(len, 0.08, 0.03, 0.006, mats.steel, 0, BELT_TOP - 0.05, z, g);
      cyl(0.007, len, mats.polish, 0, 0.86, z * 0.95, g, 'x');
    });
    [-1, 1].forEach(function (s) { cyl(0.04, 0.36, mats.steel, s * (len / 2 - 0.01), BELT_TOP - 0.04, 0, g, 'z'); });
    [-2.05, -1.2, 1.2, 2.05].forEach(function (x) {
      [-0.19, 0.19].forEach(function (z) {
        cyl(0.018, 0.64, mats.steel, x, 0.34, z, g);
        cyl(0.011, 0.05, mats.steel, x, 0.03, z, g);
        cyl(0.035, 0.016, mats.rubber, x, 0.008, z, g);
        cyl(0.006, 0.14, mats.polish, x, 0.79, z * 0.95, g);
        box(0.03, 0.03, 0.03, mats.black, x, 0.86, z * 0.95, g);
      });
      cyl(0.012, 0.38, mats.steel, x, 0.25, 0, g, 'z');
    });
    rbox(0.22, 0.13, 0.16, 0.012, mats.motor, 2.2, 0.55, 0.0, g);
    box(0.1, 0.05, 0.16, mats.steel, 2.2, 0.635, 0, g);
    cyl(0.04, 0.1, mats.steel, 2.34, 0.55, 0, g, 'x');
    return g;
  }

  /* ---------- garrafón de 18.9 L (perfil tomado de la foto de referencia) ---------- */
  function lathe(pts, seg) {
    return new T.LatheGeometry(pts.map(function (p) { return new T.Vector2(p[0], p[1]); }), seg || 56);
  }
  var bodyPts = [
    [0.0, 0.014], [0.07, 0.006], [0.105, 0.002], [0.122, 0.012], [0.131, 0.03],
    [0.132, 0.06], [0.132, 0.17], [0.131, 0.1747], [0.1344, 0.1813], [0.1344, 0.2178], [0.131, 0.2245],
    [0.131, 0.2808], [0.130, 0.2942], [0.1344, 0.3207], [0.1344, 0.344], [0.1295, 0.3506],
    [0.1062, 0.3772], [0.078, 0.4104], [0.0564, 0.427], [0.036, 0.44], [0.0315, 0.4436], [0.032, 0.447],
    [0.034, 0.45], [0.031, 0.454], [0.0282, 0.467], [0.0272, 0.4735], [0.0265, 0.474]
  ];
  var waterPts = [[0.0, 0.018]].concat(bodyPts.slice(1).filter(function (p) { return p[1] <= 0.436; }).map(function (p) { return [Math.max(0, p[0] - 0.004), p[1]]; }), [[0.0, 0.436]]);
  var geoBody = lathe(bodyPts), geoWater = lathe(waterPts);
  var geoSleeve = lathe([[0.0318, 0.446], [0.030, 0.462], [0.029, 0.478], [0.0285, 0.495], [0.027, 0.505], [0.02, 0.511], [0.0, 0.512]], 40);
  var geoLabel = new T.CylinderGeometry(0.1336, 0.1336, 0.1115, 64, 1, true, -2.1, 4.2);
  var geoBump = new T.SphereGeometry(0.035, 20, 14);
  function makeBottle() {
    var g = new T.Group();
    var b = new T.Mesh(geoBody, mats.pet); b.renderOrder = 2; g.add(b);
    var w = new T.Mesh(geoWater, mats.water); w.renderOrder = 1; w.castShadow = true; g.add(w);
    var lb = new T.Mesh(geoLabel, mats.label); lb.position.y = 0.1675; lb.castShadow = false; g.add(lb);
    var bump = new T.Mesh(geoBump, mats.pet); bump.scale.set(1, 0.8, 0.5); bump.position.set(0, 0.385, 0.09); bump.renderOrder = 2; g.add(bump);
    var cap = new T.Mesh(new T.CylinderGeometry(0.0265, 0.0265, 0.035, 28), mats.capBlue); cap.position.y = 0.4915; g.add(cap);
    var sm = new T.MeshStandardMaterial({ color: 0x2d62c8, metalness: 0.05, roughness: 0.45, transparent: true, opacity: 0.85, side: T.DoubleSide, emissive: 0xff6a1a, emissiveIntensity: 0 });
    var sl = new T.Mesh(geoSleeve, sm); sl.renderOrder = 3; sl.castShadow = true; g.add(sl);
    g.userData = { sleeve: sl, mat: sm, x: 0 };
    return g;
  }
  function shrinkState(bt, heat, sh) {
    var u = bt.userData, sc = 1 + 0.75 * (1 - sh);
    u.sleeve.scale.set(sc, 1, sc);
    u.sleeve.position.y = -0.014 * (1 - sh);
    u.mat.emissiveIntensity = heat * 0.55;
    u.mat.roughness = 0.5 - 0.28 * sh; u.mat.opacity = 0.82 + 0.15 * sh;
  }

  /* ---------- escenas ---------- */
  var real = new T.Group(), proc = new T.Group();
  scene.add(real); scene.add(proc); proc.visible = false;

  var rP = buildPedestal(false), rT = buildTable(false);
  real.add(rP.group); real.add(rT.group);
  var rB = makeBottle(); real.add(rB); shrinkState(rB, 0, 1);

  var conv = buildConveyor(); proc.add(conv);
  var tuns = { ped: buildPedestal(true), mesa: buildTable(true) };
  proc.add(tuns.ped.group); proc.add(tuns.mesa.group);
  tuns.ped.group.visible = true; tuns.mesa.group.visible = false;
  [tuns.ped, tuns.mesa].forEach(function (t) { t.group.add(t.parts.obj); });

  var sim = { running: true, speed: 0.3, cut: true, kind: 'ped', count: 0, bottles: [], spawnX: -2.2, endX: 2.3, gap: 0.95, last: null, time: 0, mode: 'real' };
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) sim.running = false;
  for (var bi = 0; bi < 6; bi++) {
    var bt = makeBottle(); proc.add(bt); bt.position.y = BELT_TOP + 0.004; sim.bottles.push(bt);
  }
  for (var k = 0; k < 5; k++) { sim.bottles[k].userData.x = sim.spawnX + k * sim.gap; }
  sim.bottles[5].visible = false; sim.bottles[5].userData.x = 99;
  sim.last = sim.bottles[0];

  function sstep(a, b, x) { var t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
  function updateBottle(bt, L) {
    var u = bt.userData, x = u.x; bt.position.x = x;
    var t = (x + L / 2) / L;
    var heat = t < 0 ? 0 : t <= 1 ? sstep(0, 0.25, t) : Math.max(0, 1 - (t - 1) / 0.5);
    var sh = sstep(0.2, 0.85, t);
    shrinkState(bt, heat, sh);
    return t;
  }

  var cur = tuns.ped, simTime = 0;
  function stepSim(dt) {
    var L = cur.L;
    simTime += dt;
    if (sim.running) {
      var v = sim.speed * dt;
      sim.bottles.forEach(function (b) { if (b.visible) b.userData.x += v; });
      sim.bottles.forEach(function (b) {
        if (b.visible && b.userData.x > sim.endX) { b.visible = false; sim.count++; $('cntn').textContent = sim.count; }
      });
      if (sim.last.userData.x >= sim.spawnX + sim.gap) {
        for (var i = 0; i < sim.bottles.length; i++) {
          var b = sim.bottles[i];
          if (!b.visible) { b.visible = true; b.userData.x = sim.spawnX; sim.last = b; break; }
        }
      }
    }
    var near = null, nd = 99;
    sim.bottles.forEach(function (b) {
      if (!b.visible) return;
      var t = updateBottle(b, L), d = Math.abs(b.userData.x);
      if (d < nd) { nd = d; near = t; }
    });
    var stg = near === null ? -1 : near < 0 ? 0 : near < 0.85 ? 1 : 2;
    for (var s = 0; s < 3; s++) $('s' + s).setAttribute('data-on', String(s === stg));
    var pulse = 0.5 + 0.2 * Math.sin(simTime * 6);
    mats.heater.emissiveIntensity = sim.mode === 'proc' ? pulse + 0.2 : 0.5;
    var cutOn = sim.cut && sim.mode === 'proc';
    cur.body.front.visible = !cutOn;
    cur.body.light.intensity = cutOn ? 0.9 + 0.2 * Math.sin(simTime * 6) : 0;
    cur.parts.obj.visible = cutOn;
    if (cutOn && sim.running) cur.parts.update(dt, simTime);
  }
  stepSim(0);

  /* ---------- cámara ---------- */
  var presets = { real: { az: 0.6, el: 0.3, zoom: 1 }, proc: { az: 0.5, el: 0.28, zoom: 1 } };
  var view = { az: 0.6, el: 0.3, zoom: 1 }, target = new T.Vector3(0, 0.8, 0), baseDist = 6;
  var W = 0, H = 0;
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function layout() {
    var a = W / H, wide = a >= 1, halfW, halfH, th = Math.tan(camera.fov * Math.PI / 360);
    if (sim.mode === 'real') {
      if (wide) { rP.group.position.set(-1.25, 0, 0); rT.group.position.set(1.15, 0, 0); rB.position.set(-0.05, 0, 0.95); halfW = 2.3; }
      else { rP.group.position.set(-0.7, 0, -0.7); rT.group.position.set(0.75, 0, 0.7); rB.position.set(-0.9, 0, 1.0); halfW = 1.7; }
      halfH = 1.1; target.set(0, 0.92, 0);
    } else {
      halfW = wide ? 2.6 : 1.5; halfH = 1.1; target.set(0, 0.95, 0);
    }
    baseDist = Math.max(halfH / th, halfW / (th * a)) * 1.12;
  }
  function updateCam() {
    var d = baseDist * view.zoom;
    camera.position.set(target.x + d * Math.sin(view.az) * Math.cos(view.el), target.y + d * Math.sin(view.el), target.z + d * Math.cos(view.az) * Math.cos(view.el));
    camera.lookAt(target);
  }
  function resize() {
    var r = stage.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return;
    W = Math.round(r.width); H = Math.round(r.height);
    renderer.setSize(W, H); camera.aspect = W / H; camera.updateProjectionMatrix(); layout();
  }
  new ResizeObserver(resize).observe(stage);

  function applyTheme() {
    scene.background = new T.Color(tok('--bg'));
    floor.material.opacity = parseFloat(tok('--floor-shadow')) || 0.22;
  }
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  var dq = window.matchMedia('(prefers-color-scheme: dark)');
  if (dq.addEventListener) dq.addEventListener('change', applyTheme);
  applyTheme();

  /* ---------- interacción ---------- */
  var auto = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ptrs = new Map(), pinch0 = 0, zoom0 = 1;
  function pd() { var a = Array.from(ptrs.values()); return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); }
  stage.addEventListener('pointerdown', function (e) {
    try { stage.setPointerCapture(e.pointerId); } catch (x) {}
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); auto = false;
    if (ptrs.size === 2) { pinch0 = pd(); zoom0 = view.zoom; }
  });
  stage.addEventListener('pointermove', function (e) {
    var p = ptrs.get(e.pointerId); if (!p) return;
    var dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 1) { view.az -= dx * 0.007; view.el = clamp(view.el + dy * 0.005, 0.03, 1.45); }
    else if (ptrs.size === 2 && pinch0 > 0) view.zoom = clamp(zoom0 * pinch0 / pd(), 0.25, 2.2);
  });
  function rel(e) { ptrs.delete(e.pointerId); pinch0 = 0; }
  stage.addEventListener('pointerup', rel); stage.addEventListener('pointercancel', rel);
  stage.addEventListener('wheel', function (e) { e.preventDefault(); auto = false; view.zoom = clamp(view.zoom * Math.exp(e.deltaY * 0.0012), 0.25, 2.2); }, { passive: false });
  stage.addEventListener('dblclick', function () { var p = presets[sim.mode]; view.az = p.az; view.el = p.el; view.zoom = p.zoom; });
  stage.addEventListener('keydown', function (e) {
    var k = e.key, u = true;
    if (k === 'ArrowLeft') view.az += 0.1; else if (k === 'ArrowRight') view.az -= 0.1;
    else if (k === 'ArrowUp') view.el = clamp(view.el - 0.06, 0.03, 1.45); else if (k === 'ArrowDown') view.el = clamp(view.el + 0.06, 0.03, 1.45);
    else if (k === '+' || k === '=') view.zoom = clamp(view.zoom * 0.9, 0.25, 2.2); else if (k === '-') view.zoom = clamp(view.zoom * 1.1, 0.25, 2.2);
    else u = false;
    if (u) { e.preventDefault(); auto = false; }
  });

  /* ---------- controles ---------- */
  function setMode(m) {
    if (m === 'real') mats.heater.emissiveIntensity = 0.5;
    sim.mode = m; real.visible = m === 'real'; proc.visible = m === 'proc';
    $('m-real').setAttribute('aria-selected', String(m === 'real')); $('m-proc').setAttribute('aria-selected', String(m === 'proc'));
    $('stages').hidden = m !== 'proc'; $('bar').hidden = m !== 'proc';
    var p = presets[m]; view.az = p.az; view.el = p.el; view.zoom = p.zoom;
    auto = m === 'real' && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    layout();
  }
  $('m-real').addEventListener('click', function () { setMode('real'); });
  $('m-proc').addEventListener('click', function () { setMode('proc'); });
  function syncPlay() { $('play').textContent = sim.running ? 'Pausar' : 'Reanudar'; $('play').setAttribute('aria-pressed', String(sim.running)); }
  $('play').addEventListener('click', function () { sim.running = !sim.running; syncPlay(); });
  $('spd').addEventListener('input', function (e) { sim.speed = parseFloat(e.target.value); });
  function setKind(k) {
    sim.kind = k; cur = tuns[k];
    tuns.ped.group.visible = k === 'ped'; tuns.mesa.group.visible = k === 'mesa';
    tuns.ped.body.front.visible = true; tuns.mesa.body.front.visible = true;
    tuns.ped.body.light.intensity = 0; tuns.mesa.body.light.intensity = 0;
    $('k-ped').setAttribute('aria-pressed', String(k === 'ped')); $('k-mesa').setAttribute('aria-pressed', String(k === 'mesa'));
  }
  $('k-ped').addEventListener('click', function () { setKind('ped'); });
  $('k-mesa').addEventListener('click', function () { setKind('mesa'); });
  $('cut').addEventListener('click', function () { sim.cut = !sim.cut; $('cut').setAttribute('aria-pressed', String(sim.cut)); });
  syncPlay();

  resize();
  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05); last = now;
    if (auto) view.az += dt * 0.15;
    if (belt && sim.running && sim.mode === 'proc') belt.offset.x -= sim.speed * dt / BELT_LEN;
    if (sim.mode === 'proc') stepSim(dt);
    if (W > 0) { updateCam(); renderer.render(scene, camera); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
